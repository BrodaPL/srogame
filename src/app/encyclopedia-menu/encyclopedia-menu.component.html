<main class="page">
  <section class="panel panel--compact">
    <header class="panel__header">
      <p class="eyebrow">{{ 'encyclopedia.menu.eyebrow' | t }}</p>
      <h1>{{ 'encyclopedia.menu.title' | t }}</h1>
      <p class="subtitle">{{ 'encyclopedia.menu.subtitle' | t }}</p>
    </header>

    <nav class="menu">
      <button class="menu-button" type="button" routerLink="/encyclopedia/ships">
        {{ 'encyclopedia.menu.actions.ships' | t }}
      </button>
      <button class="menu-button" type="button" routerLink="/encyclopedia/defences">
        {{ 'encyclopedia.menu.actions.defences' | t }}
      </button>
      <button class="menu-button" type="button" routerLink="/encyclopedia/buildings">
        {{ 'encyclopedia.menu.actions.buildings' | t }}
      </button>
      <button class="menu-button" type="button" routerLink="/encyclopedia/technologies">
        {{ 'encyclopedia.menu.actions.technologies' | t }}
      </button>
      <button class="menu-button" type="button" routerLink="/encyclopedia/mechanics">
        {{ 'encyclopedia.menu.actions.mechanics' | t }}
      </button>
      <button class="menu-button" type="button" routerLink="/">
        {{ 'encyclopedia.menu.actions.backToMainMenu' | t }}
      </button>
    </nav>
  </section>
</main>
